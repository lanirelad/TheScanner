<!--
  Real test coverage for pwa/preferences.js's logic (Session 28,
  extended with the tri-state applied/ignored/not_set model in Session
  30, extended again in Session 44 with a timestamped {status,
  updated_at} shape + cross-device sync).

  This project's test suite is pytest, but pytest can't execute
  JavaScript, and this environment has no Node.js installed (checked
  directly, not assumed — `node`/`npm` are both absent). Rather than
  skip real test coverage for genuinely-testable client-side logic (the
  task's own explicit requirement), this is a real, plain-HTML+JS test
  harness: it loads preferences.js exactly the way index.html does, runs
  real assertions against the actual functions, and reports a real
  pass/fail count on the page and in the console. Open it directly in
  any browser (or drive it headlessly) to re-run — no build step, no
  test framework dependency, matching this whole PWA's own "no bundler,
  no framework" style.

  Session 44 adds real coverage for the one part of this file that
  touches the network (pushStatusesToServer/fetchRemoteStatuses/
  checkSyncConnection/syncStatuses) — by temporarily replacing the real
  global `fetch` with a fake one for the duration of each such test,
  same "fake the one impure boundary, keep everything else real" spirit
  as this harness's existing real-localStorage round-trip tests. This
  is a real unit-level guarantee (does this code call the right
  endpoint with the right method/headers/body, and merge/save/return
  correctly given a canned response), not a substitute for the real
  live Worker round-trip verification recorded separately in
  PROGRESS.md's Session 44 addendum.
-->

<script type="module">
"use strict";
// type="module" (not a plain classic script, unlike preferences.js
// itself): needed for the top-level `await test(...)` calls this
// session's fake-fetch sync tests use below — a module script's
// top-level scope still resolves preferences.js's globals normally
// (const/function declared by a previously-run classic script live in
// the shared global scope every later script, module or not, chains
// up through for unresolved names).

const results = [];

async function test(name, fn) {
  try {
    await fn();
    results.push({ name, pass: true });
  } catch (err) {
    results.push({ name, pass: false, error: err.message });
  }
}

function deepEqual(a, b) {
  if (a === b) return true;
  if (typeof a !== typeof b || a === null || b === null) return false;
  if (Array.isArray(a) !== Array.isArray(b)) return false;
  if (typeof a === "object") {
    const aKeys = Object.keys(a);
    const bKeys = Object.keys(b);
    if (aKeys.length !== bKeys.length) return false;
    return aKeys.every((key) => Object.prototype.hasOwnProperty.call(b, key) && deepEqual(a[key], b[key]));
  }
  return false;
}

// Real bug caught by this harness itself while writing these tests:
// JSON.stringify-based comparison is key-order sensitive, but plain JS
// objects (`{...filters, [key]: value}`) don't guarantee insertion
// order matches what a hand-written expected literal happens to use.
// Two of these tests initially reported false failures for exactly
// that reason — deepEqual (order-independent) is what's actually
// correct to assert against, since preferences.js's own callers never
// rely on key order either.
function assertEqual(actual, expected, label) {
  if (!deepEqual(actual, expected)) {
    throw new Error(`${label || "assertEqual"}: expected ${JSON.stringify(expected)}, got ${JSON.stringify(actual)}`);
  }
}

function assertTrue(value, label) {
  if (value !== true) throw new Error(`${label || "assertTrue"}: expected true, got ${JSON.stringify(value)}`);
}

function assertFalse(value, label) {
  if (value !== false) throw new Error(`${label || "assertFalse"}: expected false, got ${JSON.stringify(value)}`);
}

// Fixed, arbitrary timestamps for deterministic assertions — real
// ISO8601 strings, ordered T1 < T2 < T3, so tests can assert real
// last-write-wins outcomes without depending on wall-clock time.
const T1 = "2026-01-01T00:00:00.000Z";
const T2 = "2026-01-02T00:00:00.000Z";
const T3 = "2026-01-03T00:00:00.000Z";

test("setJobStatus: NOT_SET now stores an explicit tombstone, not a deleted key", () => {

  const result = setJobStatus("abc123", { abc123: { status: "ignored", updated_at: T1 } }, JOB_STATUS.APPLIED, T2);

  const result = setJobStatus("abc123", { abc123: { status: "applied", updated_at: T1 } }, JOB_STATUS.IGNORED, T2);

  const inputCopy = JSON.stringify(input);
  setJobStatus("abc123", input, JOB_STATUS.IGNORED, T2);

    abc123: { status: "ignored", updated_at: T2 },
    def456: { status: "applied", updated_at: T1 },

// --- mergeStatuses (Session 44): the real conflict-resolution rule ------

test("mergeStatuses: remote entry newer than local -> remote wins", () => {
  const local = { a: { status: "applied", updated_at: T1 } };
  const remote = { a: { status: "ignored", updated_at: T2 } };
  assertEqual(mergeStatuses(local, remote), { a: { status: "ignored", updated_at: T2 } });
});

test("mergeStatuses: remote entry older than local -> local wins (kept as-is)", () => {
  const local = { a: { status: "ignored", updated_at: T2 } };
  const remote = { a: { status: "applied", updated_at: T1 } };
  assertEqual(mergeStatuses(local, remote), { a: { status: "ignored", updated_at: T2 } });
});

test("mergeStatuses: job_id only present remotely -> adopted", () => {
  const local = {};
  const remote = { a: { status: "applied", updated_at: T1 } };
  assertEqual(mergeStatuses(local, remote), { a: { status: "applied", updated_at: T1 } });
});

test("mergeStatuses: job_id only present locally -> kept", () => {
  const local = { a: { status: "applied", updated_at: T1 } };
  const remote = {};
  assertEqual(mergeStatuses(local, remote), { a: { status: "applied", updated_at: T1 } });
});

test("mergeStatuses: a newer remote NOT_SET tombstone correctly overrides an older local applied mark", () => {
  const local = { a: { status: "applied", updated_at: T1 } };
  const remote = { a: { status: "not_set", updated_at: T2 } };
  const merged = mergeStatuses(local, remote);
  assertEqual(merged, { a: { status: "not_set", updated_at: T2 } });
  assertFalse(isApplied("a", merged), "the clear must actually take effect, not just be stored inertly");
});

test("mergeStatuses: does not mutate either input (pure function)", () => {
  const local = { a: { status: "applied", updated_at: T1 } };
  const remote = { a: { status: "ignored", updated_at: T2 } };
  const localCopy = JSON.stringify(local);
  const remoteCopy = JSON.stringify(remote);
  mergeStatuses(local, remote);
  assertEqual(JSON.parse(localCopy), local, "local mutated");
  assertEqual(JSON.parse(remoteCopy), remote, "remote mutated");
});

test("mergeStatuses: multiple job_ids each resolve independently", () => {
  const local = {
    a: { status: "applied", updated_at: T2 }, // local newer -> stays
    b: { status: "ignored", updated_at: T1 }, // remote newer -> replaced
  };
  const remote = {
    a: { status: "ignored", updated_at: T1 },
    b: { status: "not_set", updated_at: T3 },
    c: { status: "applied", updated_at: T1 }, // remote-only -> adopted
  };
  assertEqual(mergeStatuses(local, remote), {
    a: { status: "applied", updated_at: T2 },
    b: { status: "not_set", updated_at: T3 },
    c: { status: "applied", updated_at: T1 },
  });
});

test("mergeStatuses: missing/empty remote -> local returned unchanged", () => {
  const local = { a: { status: "applied", updated_at: T1 } };
  assertEqual(mergeStatuses(local, {}), local);
  assertEqual(mergeStatuses(local, undefined), local);
});

// --- Network-touching sync functions: real fetch, faked for this test ---
// (Session 44). Same principle as this project's other test harnesses:
// fake the one impure boundary (here, the global `fetch`), keep
// everything else — the real functions, real localStorage — genuine.

function withFakeFetch(fakeFetch, fn) {
  const realFetch = window.fetch;
  window.fetch = fakeFetch;
  return Promise.resolve()
    .then(fn)
    .finally(() => {
      window.fetch = realFetch;
    });
}

function fakeJSONResponse(body, ok = true) {
  return { ok, json: async () => body };
}

await test("pushStatusesToServer: POSTs to /api/sync-status with the secret header and full body", async () => {
  localStorage.removeItem(SYNC_SECRET_KEY);
  setSyncSecret("test-secret");
  let captured = null;
  await withFakeFetch(
    async (url, options) => {
      captured = { url, options };
      return fakeJSONResponse({ ok: true, statuses: {} });
    },
    () => pushStatusesToServer({ a: { status: "applied", updated_at: T1 } })
  );
  assertEqual(captured.url, SYNC_ENDPOINT, "must call the sync endpoint");
  assertEqual(captured.options.method, "POST", "must POST");
  assertEqual(captured.options.headers["x-sync-secret"], "test-secret", "must send the stored secret");
  assertEqual(JSON.parse(captured.options.body), { statuses: { a: { status: "applied", updated_at: T1 } } });
  localStorage.removeItem(SYNC_SECRET_KEY);
});

await test("pushStatusesToServer: never throws even when fetch itself rejects (offline)", async () => {
  await withFakeFetch(
    async () => {
      throw new Error("simulated offline");
    },
    () => pushStatusesToServer({ a: { status: "applied", updated_at: T1 } })
  );
  // Reaching this line at all is the real assertion — a throw inside
  // would have failed this test via the outer test() wrapper's catch.
});

await test("checkSyncConnection: true only for a real ok response", async () => {

  assertTrue(okResult);

  assertFalse(failResult);

await test("syncStatuses: pulls, merges with local, saves the merge locally, and pushes it back", async () => {
  localStorage.removeItem(JOB_STATUS_KEY);
  localStorage.removeItem(LEGACY_APPLIED_JOBS_KEY);
  saveJobStatuses({
    a: { status: "applied", updated_at: T2 }, // newer than remote's — must survive the merge
    b: { status: "ignored", updated_at: T1 }, // older than remote's — must be replaced
  });

  const pushedBodies = [];
  const merged = await withFakeFetch(
    async (url, options) => {
      if (options.method === "GET") {
        return fakeJSONResponse({
          ok: true,
          statuses: {
            a: { status: "ignored", updated_at: T1 },
            b: { status: "not_set", updated_at: T2 },
            c: { status: "applied", updated_at: T1 },
          },
        });
      }
      pushedBodies.push(JSON.parse(options.body));
      return fakeJSONResponse({ ok: true });
    },
    () => syncStatuses()
  );

  const expected = {
    a: { status: "applied", updated_at: T2 },
    b: { status: "not_set", updated_at: T2 },
    c: { status: "applied", updated_at: T1 },
  };
  assertEqual(merged, expected, "syncStatuses must return the real merged result");
  assertEqual(loadJobStatuses(), expected, "the merge must actually be saved locally");
  assertTrue(pushedBodies.length === 1, "must push the merged result back exactly once");
  assertEqual(pushedBodies[0], { statuses: expected }, "must push the FULL merged map, not a diff");

  localStorage.removeItem(JOB_STATUS_KEY);
});

await test("syncStatuses: this device's pre-existing local-only history is what gets pushed on a first sync (migration falls out for free)", async () => {
  localStorage.removeItem(JOB_STATUS_KEY);
  localStorage.removeItem(LEGACY_APPLIED_JOBS_KEY);
  // Simulates a device with real Session 28-era history and nothing
  // ever synced yet.
  localStorage.setItem(LEGACY_APPLIED_JOBS_KEY, JSON.stringify({ oldjob: true }));

  let pushedBody = null;
  await withFakeFetch(
    async (url, options) => {
      if (options.method === "GET") return fakeJSONResponse({ ok: true, statuses: {} });
      pushedBody = JSON.parse(options.body);
      return fakeJSONResponse({ ok: true });
    },
    () => syncStatuses()
  );

  assertEqual(
    pushedBody,
    { statuses: { oldjob: { status: "applied", updated_at: UNKNOWN_UPDATED_AT } } },
    "pre-existing local-only history must be included in the very first push, not discarded"
  );

  // syncStatuses() calls saveJobStatuses() internally as part of the
  // real behavior under test, so JOB_STATUS_KEY (not just the legacy
  // key) now really holds the migrated "oldjob" entry — both must be
  // cleaned up, or this leaks into any other page sharing this
  // origin's localStorage (a real bug this test caught in itself:
  // opening the real app at the same http://localhost origin used to
  // run this harness surfaced a stray "oldjob" entry from an earlier,
  // incompletely-cleaned-up run of this exact test).
  localStorage.removeItem(JOB_STATUS_KEY);
  localStorage.removeItem(LEGACY_APPLIED_JOBS_KEY);
});

test("getSyncSecret: missing key -> empty string, not an error", () => {

test("setSyncSecret + getSyncSecret round-trips through real localStorage", () => {
