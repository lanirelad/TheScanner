<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TheScanner</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/icon-192.png" />
  <meta name="theme-color" content="#0b1015" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="radar-backdrop" aria-hidden="true"></div>

  <header>
    <h1>
      <span class="radar-dot" aria-hidden="true"></span>
      <div class="wordmark">The<span>Scanner</span></div>
    </h1>
    <button id="theme-toggle" type="button" aria-label="Toggle dark/light theme">🌙 Dark</button>
  </header>

  <main>
    <p class="generated-at" id="generated-at"></p>

    <section class="summary-strip" id="summary-strip" aria-label="Scan summary">
      <!-- Filled by app.js from latest_scan.json -->
    </section>

    <section class="budget-widget" aria-label="Scan budget">
      <h2>GitHub Actions budget this month</h2>
      <div class="budget-bar-track">
        <div class="budget-bar-fill" id="budget-bar-fill"></div>
      </div>
      <div class="budget-numbers" id="budget-numbers"></div>
      <p class="budget-note" id="budget-note"></p>
    </section>

    <section class="role-filters" id="role-filters" aria-label="Role filters" hidden>
      <h2>Show roles</h2>
      <div class="role-filter-toggles" id="role-filter-toggles">
        <!-- Filled by app.js: one toggle per role category seen in latest_scan.json's matches -->
      </div>
    </section>

    <div id="job-groups">
      <!-- Filled by app.js: one .job-group per scan_status, from latest_scan.json -->
    </div>
  </main>

  <div class="sonar-corner">
    <div class="radar-screen"></div>
    <div class="range-ring r1"></div>
    <div class="range-ring r2"></div>
    <div class="range-ring r3"></div>
    <div class="crosshair"></div>
    <div class="sweep-bg"></div>
    <img src="real_mascot.png" alt="TheScanner mascot">
  </div>

  <script src="preferences.js"></script>
  <script src="app.js"></script>
</body>
</html>
